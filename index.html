<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/>
            <path d="M8 12l2.5 2.5L16 9"/>
          </svg>
        </span>
        <h1 class="app-name">Personal Hub</h1>
      </div>
      <nav class="sidebar-nav">
        <button class="nav-item active" data-module="tasks">
          <span class="nav-icon">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="3" y="3" width="14" height="14" rx="2.5"/>
              <path d="M7 10l2 2 4-4"/>
            </svg>
          </span>
          <span class="nav-label">Tasks</span>
        </button>
        <button class="nav-item" data-module="dining">
          <span class="nav-icon">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M6 2v5a2 2 0 002 2 2 2 0 002-2V2"/>
              <path d="M8 9v9"/>
              <path d="M14 2c0 0 2 2.5 2 5.5h-2v10.5"/>
            </svg>
          </span>
          <span class="nav-label">Dining</span>
        </button>
        <button class="nav-item" data-module="upgrades">
          <span class="nav-icon">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M10 2l2.09 4.26L17 7.27l-3.5 3.41.83 4.82L10 13.25l-4.33 2.25.83-4.82L3 7.27l4.91-.71z"/>
            </svg>
          </span>
          <span class="nav-label">Upgrades</span>
        </button>
        <button class="nav-item" data-module="people">
          <span class="nav-icon">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
              <circle cx="10" cy="6.5" r="3"/>
              <path d="M3.5 18c0-3.6 2.9-6.5 6.5-6.5s6.5 2.9 6.5 6.5"/>
            </svg>
          </span>
          <span class="nav-label">People</span>
        </button>
        <button class="nav-item" data-module="reading">
          <span class="nav-icon">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M4 2.5h8a2 2 0 012 2v13l-4-2.5-4 2.5V4.5a2 2 0 00-2-2z"/>
              <path d="M10 2.5v13"/>
            </svg>
          </span>
          <span class="nav-label">Reading</span>
        </button>
        <button class="nav-item" data-module="media">
          <span class="nav-icon">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
              <circle cx="10" cy="10" r="7.5"/>
              <path d="M8 7.5l5 2.5-5 2.5V7.5z" fill="currentColor" stroke="none"/>
            </svg>
          </span>
          <span class="nav-label">Media</span>
        </button>
      </nav>
      <div class="sidebar-footer">
        <button class="sidebar-action" id="exportBtn">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M8 2v8M5 7l3 3 3-3M2 11v2a1 1 0 001 1h10a1 1 0 001-1v-2"/>
          </svg>
          Export
        </button>
        <button class="sidebar-action" id="importBtn">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M8 10V2M5 5l3-3 3 3M2 11v2a1 1 0 001 1h10a1 1 0 001-1v-2"/>
          </svg>
          Import
        </button>
        <input type="file" id="importFile" accept=".json" style="display:none">
      </div>
    </aside>

    <main class="main" id="main">
    </main>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle"></h2>
        <button class="modal-close" id="modalClose" aria-label="Close">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M2 2l12 12M14 2L2 14"/>
          </svg>
        </button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="modalCancel">Cancel</button>
        <button class="btn btn-primary" id="modalSubmit">Save</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
